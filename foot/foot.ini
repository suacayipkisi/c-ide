# Dedicated terminal window for the C IDE (VS Code Dark Modern colors).
[main]
font=Cascadia Mono NF:size=11
pad=6x4
app-id=cide
title=C IDE
initial-window-size-chars=180x48

[mouse]
hide-when-typing=yes

[colors-dark]
background=1f1f1f
foreground=cccccc
selection-background=264f78
selection-foreground=ffffff
regular0=000000
regular1=cd3131
regular2=0dbc79
regular3=e5e510
regular4=2472c8
regular5=bc3fbc
regular6=11a8cd
regular7=e5e5e5
bright0=666666
bright1=f14c4c
bright2=23d18b
bright3=f5f543
bright4=3b8eea
bright5=d670d6
bright6=29b8db
bright7=e5e5e5
